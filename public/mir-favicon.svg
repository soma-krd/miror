<!-- Mir — Favicon (SVG, scalable) -->
<!-- Renders crisply at 16x16 up to 512x512 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Slate background (rounded for app-like feel) -->
  <rect width="512" height="512" rx="96" fill="#0F172A"/>

  <!-- Hexagon outline -->
  <polygon
    points="432,256 344,408.84 168,408.84 80,256 168,103.16 344,103.16"
    fill="#10B981"
    fill-opacity="0.10"
    stroke="#10B981"
    stroke-width="16"
    stroke-linejoin="round"
  />

  <!-- Chevron -->
  <polygon
    points="196,172 248,172 300,256 248,340 196,340 252,256"
    fill="#F1F5F9"
  />

  <!-- Status dot -->
  <circle cx="344" cy="168" r="14" fill="#FBBF24"/>
</svg>
