<!-- Mir — Full Logo with Wordmark
     Symbol + "Mir" text. Use for splash screens, about dialogs, marketing. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" fill="none">
  <!-- Symbol (left) — 200x200 region -->
  <g transform="translate(0, 0)">
    <!-- Hexagon -->
    <polygon
      points="168,100 130,165.32 54,165.32 16,100 54,34.68 130,34.68"
      fill="#10B981"
      fill-opacity="0.10"
      stroke="#10B981"
      stroke-width="7"
      stroke-linejoin="round"
    />
    <!-- Chevron -->
    <polygon
      points="74,68 92,68 116,100 92,132 74,132 98,100"
      fill="#F1F5F9"
    />
    <!-- Status dot -->
    <circle cx="130" cy="54" r="6" fill="#FBBF24"/>
  </g>

  <!-- Wordmark "Mir" — right of symbol -->
  <!-- Using a geometric sans-serif. Falls back to system fonts. -->
  <text
    x="220" y="130"
    font-family="'Geist Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="120"
    font-weight="700"
    fill="#F1F5F9"
    letter-spacing="-4"
  >Mir</text>

  <!-- The "i" dot replaced with an emerald diamond for brand detail -->
  <rect x="265" y="55" width="14" height="14" fill="#10B981" transform="rotate(45 272 62)"/>
</svg>
